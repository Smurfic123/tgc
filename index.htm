<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Открытка</title>
    <script src="https://telegram.org" async></script>
    <style>
        h2 {
            font-size: 38px;      /* Увеличивает размер букв (можешь поставить 35px или 42px) */
            line-height: 1.25;    /* Делает расстояние между строками аккуратным */
            margin: 10px 0;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
              /* Фоновая картинка bg.jpg с затемнением 0.45, чтобы белый текст хорошо читался */
            background-image: linear-gradient(rgba(0, 0, 0, 0.15), rgba(0, 0, 0, 0.15)), url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #1c1c1e; /* Запасной темный фон, пока грузится картинка */

            color: #feecce;
            font-family: 'Great Vibes', cursive;
            text-align: center;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;

            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        .screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            z-index: 2;
        }
        .hidden { display: none !important; }
        .buttons-row {
            display: flex;
            gap: 20px;
            margin-top: 25px;
        }
        button {
            font-family: inherit;
            padding: 16px 36px;
            font-size: 20px;
            font-weight: 600;
            border: 3px solid #feecce;
            border-radius: 15px;
            cursor: pointer;
            transition: transform 0.15s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-yes { background-color: #ba0025; color: white; }
        .btn-no {
            background-color: #ffffff;
            color: rgb(0, 0, 0);
            border: 3px solid #ba0025;
            transition: top 0.2s ease, left 0.2s ease;
        }
        .heart {
            font-size: 100px;
            cursor: pointer;
            transition: transform 0.12s ease;
            -webkit-tap-highlight-color: transparent;
            padding: 20px;
        }
        .subtext { color: #8e8e93; font-size: 25px; margin-top: 10px; }

        .custom-img {
            width: 180px;          /* Ширина картинки */
            height: 180px;         /* Высота картинки */
            object-fit: cover;     /* Чтобы картинка не сплющивалась */
            cursor: pointer;
            transition: transform 0.12s ease;
            margin-bottom: 15px;
        }
        .bonus-img {
            width: 400px;           /* Ширина финальной картинки */
            height: auto;           /* Высота подстроится сама, чтобы фото не сплющилось */
            border-radius: 16px;    /* Красивые закругленные углы */
            margin-top: 15px;       /* Отступ сверху от текста */
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4); /* Красивая тень */
        }
        .gift-img {
            width: 200px;          /* Ширина картинки (можешь поменять на 120px или 160px) */
            height: 200px;         /* Высота картинки */
            object-fit: contain;   /* Сохраняет пропорции картинки, не обрезая края */
            margin-bottom: 10px;   /* Небольшой отступ вниз до текста */
        }

    </style>
</head>
<body>

    <div class="screen" id="question-screen">
        <img src="pic.png" class="gift-img" alt="открытка">
        
        <h2>Окрыточка<br>Будешь открывать?</h2>
        <div class="buttons-row">
            <button class="btn-yes" id="yes-btn">Да</button>
            <button class="btn-no" id="no-btn">НЕТ</button>
        </div>
    </div>

    <div class="screen hidden" id="heart-screen">
       <img src="heart.png" id="heart" class="custom-img" alt="сердечко">
        <h2 id="text">Жми чтобы сердце билось</h2>

        <img src="bonus.png" id="bonus-img" class="bonus-img hidden" alt="надпись">

        <div class="subtext" id="counter">Нажато: 0 / 5</div>
    </div>

    <script>
        window.addEventListener('load', () => {
            try {
                if (window.Telegram && window.Telegram.WebApp) {
                    window.Telegram.WebApp.ready();
                    window.Telegram.WebApp.expand();
                }
            } catch (e) {}
        });

        const questionScreen = document.getElementById('question-screen');
        const heartScreen = document.getElementById('heart-screen');
        const yesBtn = document.getElementById('yes-btn');
        const noBtn = document.getElementById('no-btn');

        function vibrate(type) {
            try {
                const tg = window.Telegram && window.Telegram.WebApp;
                if (tg && tg.HapticFeedback) {
                    type === 'success' 
                        ? tg.HapticFeedback.notificationOccurred('success') 
                        : tg.HapticFeedback.impactOccurred(type);
                }
            } catch (e) {}
        }

        function moveNoButton(e) {
            if (e) e.preventDefault();
            vibrate('light');
            noBtn.style.position = 'fixed';
            const maxX = window.innerWidth - noBtn.offsetWidth - 20;
            const maxY = window.innerHeight - noBtn.offsetHeight - 20;
            noBtn.style.left = Math.max(20, Math.floor(Math.random() * maxX)) + 'px';
            noBtn.style.top = Math.max(20, Math.floor(Math.random() * maxY)) + 'px';
        }

        noBtn.addEventListener('pointerenter', moveNoButton);
        noBtn.addEventListener('pointerdown', moveNoButton);

        yesBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            questionScreen.classList.add('hidden');
            heartScreen.classList.remove('hidden');
            vibrate('medium');
        });

        // Самый надежный способ анимации салюта (через CSS transition)
        function launchFireworks() {
            const emojis = ['💖', '✨', '❤️', '🌸'];
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight * 0.45;

            for (let i = 0; i < 45; i++) {
                const el = document.createElement('div');
                el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                el.style.position = 'fixed';
                el.style.left = centerX + 'px';
                el.style.top = centerY + 'px';
                el.style.fontSize = (22 + Math.random() * 16) + 'px';
                el.style.pointerEvents = 'none';
                el.style.zIndex = '9999';
                el.style.transition = 'transform 1.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 1.3s ease-out';
                el.style.transform = 'translate(-50%, -50%) scale(0.5)';
                el.style.opacity = '1';
                document.body.appendChild(el);

                const angle = Math.random() * Math.PI * 2;
                const dist = 80 + Math.random() * 220;
                const targetX = Math.cos(angle) * dist;
                const targetY = Math.sin(angle) * dist;

                // Запускаем движение на следующем кадре отрисовки
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        el.style.transform = `translate(calc(-50% + ${targetX}px), calc(-50% + ${targetY}px)) scale(1.2)`;
                        el.style.opacity = '0';
                    });
                });

                setTimeout(() => el.remove(), 1400);
            }
        }

        let count = 0;
        const heartEl = document.getElementById('heart');
        const textEl = document.getElementById('text');
        const counterEl = document.getElementById('counter');
        const bonusImg = document.getElementById('bonus-img');

      heartEl.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            count++;

            if (count < 5) {
                // Вычисляем новый размер: +15% за каждый клик
                const baseScale = 1 + count * 0.33;
                
                // Резкий "удар" пульса в момент касания (+25% за клик)
                heartEl.style.transform = `scale(${1 + count * 0.50})`;
                
                // Через 120 мс картинка фиксируется в новом увеличенном размере
                setTimeout(() => {
                    heartEl.style.transform = `scale(${baseScale})`;
                }, 120);

                counterEl.innerText = `Нажато: ${count} / 5`;
                vibrate('heavy');
            } else {
                // На 5-й клик возвращаем нормальный размер
                heartEl.style.transform = "scale(1.0)";
                
                launchFireworks();
                heartEl.src = "cat.jpg";
                heartEl.style.borderRadius = "20px";          
                // heartEl.style.border = "3px solid #e7d2b1";
                bonusImg.classList.remove('hidden');
                textEl.style.fontSize = "35px"; 
                textEl.innerHTML = 'Если бы жизнь повторилась тысячу раз, я бы все равно выбирал тебя <span style="display: block; margin-top: 1px; font-size: 1.5em;">снова и снова...</span>';
                counterEl.innerText = "нажимай на барсика для салюта и взрыва телефона";
                vibrate('success');
            }
        });
    </script>
</body>
</html>
