<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Секретная открытка</title>
    
    <!-- 1. Подключаем скрипт Telegram -->
    <script src="https://telegram.org"></script>
    <!-- 2. Подключаем бесплатную библиотеку конфетти -->
    <script src="https://jsdelivr.net"></script>

    <style>
        /* Стили (CSS) — отвечают за внешний вид */
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #1c1c1e;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            text-align: center;
            overflow: hidden; /* Запрещаем прокрутку, чтобы кнопка не улетала за край */
            user-select: none;
            -webkit-user-select: none;
        }

        /* Контейнер для первого экрана с вопросом */
        .screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* Класс hidden полностью прячет блок со страницы */
        .hidden {
            display: none !important;
        }

        .buttons-row {
            display: flex;
            gap: 20px; /* Расстояние между кнопками Да и Нет */
            margin-top: 25px;
        }

        button {
            padding: 14px 32px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        .btn-yes {
            background-color: #30d158; /* Зеленый цвет Apple */
            color: white;
        }

        .btn-no {
            background-color: #ff453a; /* Красный цвет Apple */
            color: white;
            /* Плавный перелет кнопки на новое место за 0.2 секунды */
            transition: top 0.2s ease, left 0.2s ease; 
        }

        /* Стили для второго экрана с сердцем */
        .heart {
            font-size: 95px;
            cursor: pointer;
            transition: transform 0.12s ease;
            -webkit-tap-highlight-color: transparent;
            padding: 20px;
        }

        .subtext {
            color: #8e8e93;
            font-size: 16px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: Вопрос и убегающая кнопка -->
    <div class="screen" id="question-screen">
        <div style="font-size: 70px;">🎁</div>
        <h2>Тебе пришел секретный подарок!<br>Будешь открывать?</h2>
        <div class="buttons-row">
            <button class="btn-yes" id="yes-btn">Да!</button>
            <button class="btn-no" id="no-btn">Нет</button>
        </div>
    </div>

    <!-- ЭКРАН 2: Кликер с сердцем (изначально скрыт классом hidden) -->
    <div class="screen hidden" id="heart-screen">
        <div class="heart" id="heart">❤️</div>
        <h2 id="text">Нажми на сердце 5 раз!</h2>
        <div class="subtext" id="counter">Нажато: 0 / 5</div>
    </div>

    <script>
        // Логика (JavaScript) — отвечает за действия
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Находим все нужные элементы на странице по их id
        const questionScreen = document.getElementById('question-screen');
        const heartScreen = document.getElementById('heart-screen');
        const yesBtn = document.getElementById('yes-btn');
        const noBtn = document.getElementById('no-btn');

        // --- ЛОГИКА УБЕГАЮЩЕЙ КНОПКИ «НЕТ» ---
        function moveNoButton() {
            // Легкая вибрация при попытке нажать «Нет»
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }

            // Переводим кнопку в режим свободного позиционирования поверх экрана
            noBtn.style.position = 'fixed';

            // Вычисляем безопасные границы экрана (отнимаем размер самой кнопки, чтобы не ушла за край)
            const maxX = window.innerWidth - noBtn.offsetWidth - 20;
            const maxY = window.innerHeight - noBtn.offsetHeight - 20;

            // Генерируем случайные координаты X и Y
            const randomX = Math.max(20, Math.floor(Math.random() * maxX));
            const randomY = Math.max(20, Math.floor(Math.random() * maxY));

            // Применяем новые координаты
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        // Кнопка убегает при наведении мыши (на ПК) и при касании пальцем (на телефоне)
        noBtn.addEventListener('mouseover', moveNoButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Отменяем само нажатие, чтобы кнопка успела убежать
            moveNoButton();
        });

        // --- ПЕРЕХОД КО ВТОРОМУ ЭКРАНУ ПО КНОПКЕ «ДА» ---
        yesBtn.addEventListener('click', () => {
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }
            // Прячем первый экран и показываем второй
            questionScreen.classList.add('hidden');
            heartScreen.classList.remove('hidden');
        });

        // --- ЛОГИКА СЕРДЦА И КОНФЕТТИ ---
        let count = 0;
        const heartEl = document.getElementById('heart');
        const textEl = document.getElementById('text');
        const counterEl = document.getElementById('counter');

        heartEl.addEventListener('click', () => {
            count++;

            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('heavy');
            }

            heartEl.style.transform = `scale(${1 + count * 0.12})`;
            setTimeout(() => {
                heartEl.style.transform = `scale(${1 + count * 0.05})`;
            }, 120);

            if (count < 5) {
                counterEl.innerText = `Нажато: ${count} / 5`;
            } else if (count === 5) {
                heartEl.innerText = "💖";
                heartEl.style.transform = "scale(1.4)";
                textEl.innerText = "✨ Сюрприз! Это послание специально для тебя! ✨";
                counterEl.innerText = "Ты лучший(ая) 💌";
                
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }

                // ЗАПУСКАЕМ ВЗРЫВ КОНФЕТТИ!
                if (typeof confetti === 'function') {
                    confetti({
                        particleCount: 120, // Количество частичек
                        spread: 80,         // Угол разлета
                        origin: { y: 0.6 }  // Точка выстрела (чуть ниже центра экрана)
                    });
                }
            }
        });
    </script>
</body>
</html>
