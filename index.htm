<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Открытка</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #1c1c1e;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            text-align: center;
            overflow: hidden;
            user-select: none;
        }
        .heart {
            font-size: 90px;
            cursor: pointer;
            transition: transform 0.15s ease;
            -webkit-tap-highlight-color: transparent;
        }
        h2 {
            margin-top: 20px;
            padding: 0 20px;
            font-weight: 500;
        }
        .subtext {
            color: #8e8e93;
            font-size: 15px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="heart" id="heart" onclick="tapHeart()">❤️</div>
    <h2 id="text">Нажми на сердце 5 раз!</h2>
    <div class="subtext" id="counter">Нажато: 0 / 5</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let count = 0;
        const heartEl = document.getElementById('heart');
        const textEl = document.getElementById('text');
        const counterEl = document.getElementById('counter');

        function tapHeart() {
            count++;

            // Безопасный вызов вибрации (не сломает код на ПК)
            try {
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.impactOccurred('medium');
                }
            } catch (e) {}

            // Визуальная пульсация при клике
            heartEl.style.transform = `scale(${1 + count * 0.12})`;
            setTimeout(() => {
                heartEl.style.transform = `scale(${1 + count * 0.05})`;
            }, 150);

            if (count < 5) {
                counterEl.innerText = `Нажато: ${count} / 5`;
            } else if (count === 5) {
                // Финал открытки!
                heartEl.innerText = "💖";
                heartEl.style.transform = "scale(1.4)";
                textEl.innerText = "✨ Сюрприз! Ты разблокировал открытку! ✨";
                counterEl.innerText = "Это послание специально для тебя 💌";
                
                try {
                    if (tg.HapticFeedback) {
                        tg.HapticFeedback.notificationOccurred('success');
                    }
                } catch (e) {}
            }
        }
    </script>
</body>
</html>
