<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Секретная открытка</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #1c1c1e;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            text-align: center;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        .screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .hidden {
            display: none !important;
        }
        .buttons-row {
            display: flex;
            gap: 20px;
            margin-top: 25px;
        }
        button {
            padding: 14px 32px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.15s ease;
        }
        .btn-yes {
            background-color: #30d158;
            color: white;
        }
        .btn-no {
            background-color: #ff453a;
            color: white;
            transition: top 0.2s ease, left 0.2s ease; 
        }
        .heart {
            font-size: 95px;
            cursor: pointer;
            transition: transform 0.12s ease;
            -webkit-tap-highlight-color: transparent;
            padding: 20px;
        }
        .subtext {
            color: #8e8e93;
            font-size: 16px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="screen" id="question-screen">
        <div style="font-size: 70px;">🎁</div>
        <h2>Тебе пришел секретный подарок!<br>Будешь открывать?</h2>
        <div class="buttons-row">
            <button class="btn-yes" id="yes-btn">Да!</button>
            <button class="btn-no" id="no-btn">Нет</button>
        </div>
    </div>

    <div class="screen hidden" id="heart-screen">
        <div class="heart" id="heart">❤️</div>
        <h2 id="text">Нажми на сердце 5 раз!</h2>
        <div class="subtext" id="counter">Нажато: 0 / 5</div>
    </div>

    <!-- Скрипты внизу с async — никогда не блокируют загрузку экрана -->
    <script src="https://telegram.org" async></script>
    <script src="https://jsdelivr.net" async></script>

    <script>
        window.addEventListener('load', () => {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            }
        });

        const questionScreen = document.getElementById('question-screen');
        const heartScreen = document.getElementById('heart-screen');
        const yesBtn = document.getElementById('yes-btn');
        const noBtn = document.getElementById('no-btn');

        function vibrate(type) {
            try {
                const tg = window.Telegram && window.Telegram.WebApp;
                if (tg && tg.HapticFeedback) {
                    if (type === 'success') {
                        tg.HapticFeedback.notificationOccurred('success');
                    } else {
                        tg.HapticFeedback.impactOccurred(type);
                    }
                }
            } catch (e) {}
        }

        function moveNoButton() {
            vibrate('light');
            noBtn.style.position = 'fixed';
            const maxX = window.innerWidth - noBtn.offsetWidth - 20;
            const maxY = window.innerHeight - noBtn.offsetHeight - 20;
            const randomX = Math.max(20, Math.floor(Math.random() * maxX));
            const randomY = Math.max(20, Math.floor(Math.random() * maxY));
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        noBtn.addEventListener('mouseover', moveNoButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveNoButton();
        });

        yesBtn.addEventListener('click', () => {
            vibrate('medium');
            questionScreen.classList.add('hidden');
            heartScreen.classList.remove('hidden');
        });

        let count = 0;
        const heartEl = document.getElementById('heart');
        const textEl = document.getElementById('text');
        const counterEl = document.getElementById('counter');

        heartEl.addEventListener('click', () => {
            count++;
            vibrate('heavy');

            heartEl.style.transform = `scale(${1 + count * 0.12})`;
            setTimeout(() => {
                heartEl.style.transform = `scale(${1 + count * 0.05})`;
            }, 120);

            if (count < 5) {
                counterEl.innerText = `Нажато: ${count} / 5`;
            } else if (count === 5) {
                heartEl.innerText = "💖";
                heartEl.style.transform = "scale(1.4)";
                textEl.innerText = "✨ Сюрприз! Это послание специально для тебя! ✨";
                counterEl.innerText = "Ты лучший(ая) 💌";
                vibrate('success');

                if (typeof confetti === 'function') {
                    confetti({
                        particleCount: 120,
                        spread: 80,
                        origin: { y: 0.6 }
                    });
                }
            }
        });
    </script>
</body>
</html>
