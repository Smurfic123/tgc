<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Открытка</title>
    <script src="https://telegram.org" async></script>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
              /* Фоновая картинка bg.jpg с затемнением 0.45, чтобы белый текст хорошо читался */
            background-image: linear-gradient(rgba(0, 0, 0, 0.15), rgba(0, 0, 0, 0.15)), url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #1c1c1e; /* Запасной темный фон, пока грузится картинка */

            color: white;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            text-align: center;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        .screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            z-index: 2;
        }
        .hidden { display: none !important; }
        .buttons-row {
            display: flex;
            gap: 20px;
            margin-top: 25px;
        }
        button {
            padding: 16px 36px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.15s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-yes { background-color: #30d158; color: white; }
        .btn-no {
            background-color: #ff453a;
            color: white;
            transition: top 0.2s ease, left 0.2s ease;
        }
        .heart {
            font-size: 95px;
            cursor: pointer;
            transition: transform 0.12s ease;
            -webkit-tap-highlight-color: transparent;
            padding: 20px;
        }
        .subtext { color: #8e8e93; font-size: 16px; margin-top: 10px; }
        .version {
            position: fixed;
            bottom: 10px;
            font-size: 11px;
            color: #48484a;
        }
        .custom-img {
            width: 180px;          /* Ширина картинки */
            height: 180px;         /* Высота картинки */
            object-fit: cover;     /* Чтобы картинка не сплющивалась */
            cursor: pointer;
            transition: transform 0.12s ease;
            margin-bottom: 15px;
        }

    </style>
</head>
<body>

    <div class="screen" id="question-screen">
        <div style="font-size: 70px;">🎁</div>
        <h2>Тебе пришел секретный подарок!<br>Будешь открывать?</h2>
        <div class="buttons-row">
            <button class="btn-yes" id="yes-btn">Да!</button>
            <button class="btn-no" id="no-btn">Нет</button>
        </div>
    </div>

    <div class="screen hidden" id="heart-screen">
       <img src="heart.jpg" id="heart" class="custom-img" alt="Картинка">
        <h2 id="text">Нажми на сердце 5 раз!</h2>
        <div class="subtext" id="counter">Нажато: 0 / 5</div>
    </div>

    <!-- Индикатор версии, чтобы точно видеть, что сайт обновился -->
    <div class="version">v.3.0</div>

    <script>
        window.addEventListener('load', () => {
            try {
                if (window.Telegram && window.Telegram.WebApp) {
                    window.Telegram.WebApp.ready();
                    window.Telegram.WebApp.expand();
                }
            } catch (e) {}
        });

        const questionScreen = document.getElementById('question-screen');
        const heartScreen = document.getElementById('heart-screen');
        const yesBtn = document.getElementById('yes-btn');
        const noBtn = document.getElementById('no-btn');

        function vibrate(type) {
            try {
                const tg = window.Telegram && window.Telegram.WebApp;
                if (tg && tg.HapticFeedback) {
                    type === 'success' 
                        ? tg.HapticFeedback.notificationOccurred('success') 
                        : tg.HapticFeedback.impactOccurred(type);
                }
            } catch (e) {}
        }

        function moveNoButton(e) {
            if (e) e.preventDefault();
            vibrate('light');
            noBtn.style.position = 'fixed';
            const maxX = window.innerWidth - noBtn.offsetWidth - 20;
            const maxY = window.innerHeight - noBtn.offsetHeight - 20;
            noBtn.style.left = Math.max(20, Math.floor(Math.random() * maxX)) + 'px';
            noBtn.style.top = Math.max(20, Math.floor(Math.random() * maxY)) + 'px';
        }

        noBtn.addEventListener('pointerenter', moveNoButton);
        noBtn.addEventListener('pointerdown', moveNoButton);

        yesBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            questionScreen.classList.add('hidden');
            heartScreen.classList.remove('hidden');
            vibrate('medium');
        });

        // Самый надежный способ анимации салюта (через CSS transition)
        function launchFireworks() {
            const emojis = ['💖', '✨', '🎉', '❤️', '🌸', '🎊'];
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight * 0.45;

            for (let i = 0; i < 45; i++) {
                const el = document.createElement('div');
                el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                el.style.position = 'fixed';
                el.style.left = centerX + 'px';
                el.style.top = centerY + 'px';
                el.style.fontSize = (22 + Math.random() * 16) + 'px';
                el.style.pointerEvents = 'none';
                el.style.zIndex = '9999';
                el.style.transition = 'transform 1.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 1.3s ease-out';
                el.style.transform = 'translate(-50%, -50%) scale(0.5)';
                el.style.opacity = '1';
                document.body.appendChild(el);

                const angle = Math.random() * Math.PI * 2;
                const dist = 80 + Math.random() * 220;
                const targetX = Math.cos(angle) * dist;
                const targetY = Math.sin(angle) * dist;

                // Запускаем движение на следующем кадре отрисовки
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        el.style.transform = `translate(calc(-50% + ${targetX}px), calc(-50% + ${targetY}px)) scale(1.2)`;
                        el.style.opacity = '0';
                    });
                });

                setTimeout(() => el.remove(), 1400);
            }
        }

        let count = 0;
        const heartEl = document.getElementById('heart');
        const textEl = document.getElementById('text');
        const counterEl = document.getElementById('counter');

        heartEl.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            count++;

            heartEl.style.transform = `scale(${1 + Math.min(count, 5) * 0.12})`;
            setTimeout(() => {
                heartEl.style.transform = `scale(${1 + Math.min(count, 5) * 0.05})`;
            }, 120);

            if (count < 5) {
                counterEl.innerText = `Нажато: ${count} / 5`;
                vibrate('heavy');
            } else {
                // Запускаем салют на 5-е и все последующие нажатия!
                launchFireworks();
                heartEl.src = "cat.jpg";
                heartEl.style.transform = "scale(1.4)";
                textEl.innerText = "✨ Сюрприз! Это послание специально для тебя! ✨";
                counterEl.innerText = "Нажимай ещё для нового салюта 💌";
                vibrate('success');
            }
        });
    </script>
</body>
</html>
