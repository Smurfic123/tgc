<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Открытка</title>
    <script src="https://telegram.org" async></script>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #1c1c1e;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            text-align: center;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none; /* Запрещаем браузеру перехватывать касания */
        }
        .screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            z-index: 2;
        }
        .hidden { display: none !important; }
        .buttons-row {
            display: flex;
            gap: 20px;
            margin-top: 25px;
        }
        button {
            padding: 16px 36px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.15s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-yes { background-color: #30d158; color: white; }
        .btn-no {
            background-color: #ff453a;
            color: white;
            transition: top 0.2s ease, left 0.2s ease;
        }
        .heart {
            font-size: 95px;
            cursor: pointer;
            transition: transform 0.12s ease;
            -webkit-tap-highlight-color: transparent;
            padding: 20px;
        }
        .subtext { color: #8e8e93; font-size: 16px; margin-top: 10px; }
        
        .particle {
            position: fixed;
            font-size: 26px;
            pointer-events: none;
            z-index: 10;
            animation: fly 1.5s ease-out forwards;
        }
        @keyframes fly {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(0.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="screen" id="question-screen">
        <div style="font-size: 70px;">🎁</div>
        <h2>Тебе пришел секретный подарок!<br>Будешь открывать?</h2>
        <div class="buttons-row">
            <button class="btn-yes" id="yes-btn">Да!</button>
            <button class="btn-no" id="no-btn">Нет</button>
        </div>
    </div>

    <div class="screen hidden" id="heart-screen">
        <div class="heart" id="heart">❤️</div>
        <h2 id="text">Нажми на сердце 5 раз!</h2>
        <div class="subtext" id="counter">Нажато: 0 / 5</div>
    </div>

    <script>
        window.addEventListener('load', () => {
            try {
                if (window.Telegram && window.Telegram.WebApp) {
                    window.Telegram.WebApp.ready();
                    window.Telegram.WebApp.expand();
                }
            } catch (e) {}
        });

        const questionScreen = document.getElementById('question-screen');
        const heartScreen = document.getElementById('heart-screen');
        const yesBtn = document.getElementById('yes-btn');
        const noBtn = document.getElementById('no-btn');

        function vibrate(type) {
            try {
                const tg = window.Telegram && window.Telegram.WebApp;
                if (tg && tg.HapticFeedback) {
                    type === 'success' 
                        ? tg.HapticFeedback.notificationOccurred('success') 
                        : tg.HapticFeedback.impactOccurred(type);
                }
            } catch (e) {}
        }

        // Убегающая кнопка «Нет» (работает и на мышь, и на палец)
        function moveNoButton(e) {
            if (e) e.preventDefault();
            vibrate('light');
            noBtn.style.position = 'fixed';
            const maxX = window.innerWidth - noBtn.offsetWidth - 20;
            const maxY = window.innerHeight - noBtn.offsetHeight - 20;
            noBtn.style.left = Math.max(20, Math.floor(Math.random() * maxX)) + 'px';
            noBtn.style.top = Math.max(20, Math.floor(Math.random() * maxY)) + 'px';
        }

        // Срабатывает при наведении курсора (ПК) и в момент касания пальцем (Телефон)
        noBtn.addEventListener('pointerenter', moveNoButton);
        noBtn.addEventListener('pointerdown', moveNoButton);

        // Кнопка «Да!» (надежный переход без зависимости от вибрации)
        yesBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            questionScreen.classList.add('hidden');
            heartScreen.classList.remove('hidden');
            vibrate('medium');
        });

        // Салют из эмодзи
     // Надежный салют через встроенный движок анимаций браузера
        function launchFireworks() {
            const emojis = ['💖', '✨', '🎉', '❤️', '🌸', '🎊'];
            for (let i = 0; i < 50; i++) {
                const el = document.createElement('div');
                el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                el.style.position = 'fixed';
                el.style.left = '50%';
                el.style.top = '45%';
                el.style.fontSize = (20 + Math.random() * 18) + 'px';
                el.style.pointerEvents = 'none';
                el.style.zIndex = '9999';
                document.body.appendChild(el);

                const angle = Math.random() * Math.PI * 2;
                const dist = 90 + Math.random() * 230;
                const dx = Math.cos(angle) * dist;
                const dy = Math.sin(angle) * dist;

                // Запускаем прямой полет каждой частицы
                el.animate([
                    { transform: 'translate(-50%, -50%) scale(0.5)', opacity: 1 },
                    { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(1.2)`, opacity: 0 }
                ], {
                    duration: 1200 + Math.random() * 600,
                    easing: 'cubic-bezier(0.16, 1, 0.3, 1)',
                    fill: 'forwards'
                });

                setTimeout(() => el.remove(), 1900);
            }
        }
        // Кликер с сердцем
        let count = 0;
        const heartEl = document.getElementById('heart');
        const textEl = document.getElementById('text');
        const counterEl = document.getElementById('counter');

        heartEl.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            count++;
            vibrate('heavy');

            heartEl.style.transform = `scale(${1 + count * 0.12})`;
            setTimeout(() => {
                heartEl.style.transform = `scale(${1 + count * 0.05})`;
            }, 120);

            if (count < 5) {
                counterEl.innerText = `Нажато: ${count} / 5`;
            } else if (count === 5) {
                heartEl.innerText = "💖";
                heartEl.style.transform = "scale(1.4)";
                textEl.innerText = "✨ Сюрприз! Это послание специально для тебя! ✨";
                counterEl.innerText = "Ты лучший(ая) 💌";
                vibrate('success');
                launchFireworks();
            }
        });
    </script>
</body>
</html>
