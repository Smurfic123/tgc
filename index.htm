<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Открытка</title>
    <!-- Обязательный скрипт Telegram -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #1c1c1e;
            color: white;
            font-family: sans-serif;
            text-align: center;
        }
        .heart {
            font-size: 80px;
            cursor: pointer;
            transition: transform 0.2s;
            user-select: none;
        }
        .heart:active {
            transform: scale(1.3);
        }
    </style>
</head>
<body>
    <div class="heart" onclick="tapHeart()">❤️</div>
    <h2 id="text">Нажми на сердце!</h2>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Раскрываем приложение на весь экран

        let count = 0;
        function tapHeart() {
            count++;
            // Включаем легкую вибрацию на телефоне при нажатии
            tg.HapticFeedback.impactOccurred('medium');
            
            if (count === 5) {
                document.getElementById('text').innerText = "✨ Сюрприз! Ты разблокировал открытку! ✨";
                tg.HapticFeedback.notificationOccurred('success');
            } else {
                document.getElementById('text').innerText = `Нажато раз: ${count} из 5`;
            }
        }
    </script>
</body>
</html>
